<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>2604期结业考试题库 Flash Cards</title>
<style>
  :root {
    --paper: #f5f0e8;
    --card: #fffef9;
    --accent: #c9a96e;
    --accent-dark: #a6884a;
    --text: #3a3226;
    --text-light: #7a6e5e;
    --border: #e0d8c8;
    --wortschatz: #6a9e7b;
    --grammatik: #8a6fb5;
    --redemittel: #c9a96e;
    --sprichwort: #c9a96e;
  }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--paper);
    color: var(--text);
    margin: 0; padding: 20px;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh;
  }
  h1 { font-size: 20px; margin-bottom: 8px; color: var(--accent-dark); text-align: center; }
  .subtitle { font-size: 20px; color: var(--text-light); margin-bottom: 12px; text-align: center; }
  .progress-bar { width: 320px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
  .progress-fill { height: 100%; background: var(--accent); transition: width 0.3s; }
  .page-info { font-size: 20px; color: var(--text-light); margin-bottom: 10px; }
  .dots { display: flex; gap: 6px; margin-bottom: 15px; flex-wrap: wrap; justify-content: center; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); cursor: pointer; transition: transform 0.2s; }
  .dot:hover { transform: scale(1.3); }
  .dot.active { background: var(--accent); }
  .dot.grammatik { background: var(--grammatik); }
  .dot.redemittel { background: var(--redemittel); }
  .dot.wortschatz { background: var(--wortschatz); }
  .dot.sprichwort { background: var(--sprichwort); }
  .dot.uebung { background: var(--redemittel); }
  .dot.vokabel { background: var(--wortschatz); }
  .dot.practice { background: var(--redemittel); }
  .dot.concept { background: var(--wortschatz); }
  .dot.rule { background: var(--grammatik); }
  .card-container { perspective: 1000px; width: 90%; max-width: 750px; height: 550px; margin-bottom: 16px; }
  .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.5s; cursor: pointer; }
  .card.flipped { transform: rotateY(180deg); }
  .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); background: var(--card); padding: 25px; box-sizing: border-box; overflow-y: auto; }
  .card-back { transform: rotateY(180deg); }
  .card-number { font-size: 20px; color: var(--text-light); margin-bottom: 6px; }
  .card-label { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 20px; margin-bottom: 8px; color: #fff; }
  .label-grammatik { background: #8e7cc3; }
  .label-vokabel   { background: #5ba35b; }
  .label-uebung    { background: #c9a12e; }
  .label-redemittel { background: #c9a12e; }
  .label-sprichwort { background: #c9a12e; }
  .label-practice  { background: #c9a12e; }
  .label-concept   { background: #5ba35b; }
  .label-rule      { background: #8e7cc3; }
  .front-text { font-size: 20px; line-height: 1.6; white-space: pre-wrap; }
  .front-text table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 20px; }
  .front-text th, .front-text td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; }
  .front-text th { background: #f5f0e8; font-weight: 600; }
  .back-section { margin-bottom: 10px; }
  .back-mirror { font-size: 20px; line-height: 1.6; }
  .back-mirror table { width: 100%; border-collapse: collapse; margin: 6px 0; font-size: 20px; }
  .back-mirror th, .back-mirror td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; }
  .back-mirror th { background: #f5f0e8; font-weight: 600; }
  .back-mirror strong { font-size: 20px; }
  .back-title { font-size: 20px; font-weight: 600; color: var(--accent-dark); margin-bottom: 4px; }
  .back-content { font-size: 20px; line-height: 1.6; }
  .back-content table { width: 100%; border-collapse: collapse; margin: 6px 0; font-size: 20px; }
  .back-content th, .back-content td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; }
  .back-content th { background: #f5f0e8; font-weight: 600; }
  .preview-note { font-size: 20px; background: #f9f5ed; padding: 8px 12px; border-radius: 6px; margin-top: 8px; line-height: 1.6; }
  .back-divider { border: none; border-top: 1.5px dashed #d4b870; border-bottom: 1.5px dashed #d4b870; height: 3px; margin: 12px 0; }
  .buttons { display: flex; gap: 15px; margin-bottom: 12px; }
  button { padding: 10px 25px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-size: 20px; cursor: pointer; transition: background 0.2s; }
  button:disabled { opacity: 0.4; cursor: default; }
  .key-hint { font-size: 20px; color: var(--text-light); margin-bottom: 10px; }
  .complete { display: none; text-align: center; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; }
  .complete h2 { color: var(--accent-dark); margin-bottom: 15px; font-size: 20px; }
  .complete p { color: var(--text-light); margin-bottom: 20px; font-size: 20px; }
</style>
</head>
<body>

<h1>2604期结业考试题库 Flash Cards</h1>
<div class="subtitle">Flash Cards · 共 <span id="totalCards">87</span> 张 · 点击卡片翻转</div>

<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="page-info" id="progressText">Card 1 / 87</div>

<div class="dots" id="dots"></div>

<div class="card-container">
  <div class="card" id="card" onclick="flipCard()">
    <div class="card-face card-front" id="front"></div>
    <div class="card-face card-back" id="back"></div>
  </div>
</div>

<div class="buttons">
  <button id="prevBtn" onclick="prevCard()">← 上一张</button>
  <button id="nextBtn" onclick="nextCard()">下一张 →</button>
</div>
<div class="key-hint">← → 切换卡片 ｜ Enter/空格 翻转 ｜ 点击卡片翻转</div>

<div class="complete" id="completeScreen">
  <h2>🎉 2604期结业考试题库 全部学完！</h2>
  <p>建议休息片刻后再复习一遍，巩固记忆。</p>
  <button onclick="restart()">重新开始</button>
</div>

<script>
var cards = [
  {
    label: "例题卡",
    cat: "practice",
    front: "【单选题】中国共产党人追求的共产主义最高理想，只有在社会主义社会（____）的基础上才能实现。\nA. 充分民主和人人平等\nB. 充分发展和高度发达\nC. 充分民主和高度发达\nD. 充分发展和人人平等",
    back: '<div class="back-mirror">【单选题】中国共产党人追求的共产主义最高理想，只有在社会主义社会（<strong>充分发展和高度发达</strong>）的基础上才能实现。<br>A. 充分民主和人人平等<br>B. 充分发展和高度发达<br>C. 充分民主和高度发达<br>D. 充分发展和人人平等</div><hr class="back-divider"><div class="preview-note">讲解：共产主义是生产力高度发展的产物。马克思主义唯物史观揭示：共产主义不是道德愿望，而是物质条件成熟后的历史必然。"充分发展"指向生产力水平，"高度发达"指向整个社会的文明程度，两者共同构成共产主义的物质基础。选项 A、C、D 中的"充分民主""人人平等"属于政治上层建筑，是结果而非前提。</div><hr class="back-divider"><div class="preview-note">💡 记法："发展→发达"，两个"发"字连在一起，指向共产主义需要双重"发"力。</div>'
  },
  {
    label: "例题卡",
    cat: "practice",
    front: '【单选题】中国共产党第二十届中央委员会第四次全体会议指出，"十五五"时期是（____）的关键时期。\nA. 全面建成小康社会\nB. 基本实现社会主义现代化\nC. 全面建成社会主义现代化强国\nD. 实现第一个百年奋斗目标',
    back: '<div class="back-mirror">【单选题】中国共产党第二十届中央委员会第四次全体会议指出，"十五五"时期是（<strong>基本实现社会主义现代化</strong>）的关键时期。<br>A. 全面建成小康社会<br>B. 基本实现社会主义现代化<br>C. 全面建成社会主义现代化强国<br>D. 实现第一个百年奋斗目标</div><hr class="back-divider"><div class="preview-note">讲解：十九届五中全会明确了 2035 年远景目标——基本实现社会主义现代化。"十五五"时期（2026–2030）正是冲刺这一目标的关键五年。A 项"全面建成小康社会"已在 2020 年完成；C 项"全面建成社会主义现代化强国"是本世纪中叶的目标；D 项"第一个百年奋斗目标"对应建党一百年（2021），均已属于已完成的阶段性任务。</div><hr class="back-divider"><div class="preview-note">💡 时间线记忆：2020 小康→2035 基本现代化→2050 强国。"十五五"（2026–2030）卡在中间，对应 2035 目标。</div>'
  },
  {
    label: "例题卡",
    cat: "practice",
    front: "【单选题】习近平在党的二十大报告中指出，弘扬以伟大建党精神为源头的中国共产党人精神谱系，深化（____）集体主义、社会主义教育，着力培养担当民族复兴大任的时代新人。\nA. 民主主义\nB. 个人主义\nC. 爱国主义\nD. 民族主义",
    back: '<div class="back-mirror">【单选题】习近平在党的二十大报告中指出，弘扬以伟大建党精神为源头的中国共产党人精神谱系，深化（<strong>爱国主义</strong>）集体主义、社会主义教育，着力培养担当民族复兴大任的时代新人。<br>A. 民主主义<br>B. 个人主义<br>C. 爱国主义<br>D. 民族主义</div><hr class="back-divider"><div class="preview-note">讲解：二十大报告强调"深化爱国主义、集体主义、社会主义教育"，三"主义"构成新时代公民道德教育的核心内容。爱国主义是民族精神的核心，在三个"主义"中居于首位。B 项"个人主义"与集体主义对立；A 项"民主主义"和 D 项"民族主义"未出现在报告的此语境中。</div><hr class="back-divider"><div class="preview-note">💡 三"主义"口诀：<strong>爱</strong>国→<strong>集</strong>体→<strong>社</strong>会，首字谐音"爱集社"。</div>'
  },
  {
    label: "例题卡",
    cat: "practice",
    front: "【单选题】全党必须牢记，全面从严治党永远在路上，（____）永远在路上。\nA. 党的自我净化\nB. 党的自我提高\nC. 党的自我革新\nD. 党的自我革命",
    back: '<div class="back-mirror">【单选题】全党必须牢记，全面从严治党永远在路上，（<strong>党的自我革命</strong>）永远在路上。<br>A. 党的自我净化<br>B. 党的自我提高<br>C. 党的自我革新<br>D. 党的自我革命</div><hr class="back-divider"><div class="preview-note">讲解：这是十九大报告中的经典表述，后被反复强调。"全面从严治党"与"党的自我革命"是配套概念——前者是实践路径，后者是精神内核。A/B/C 三项"自我净化""自我提高""自我革新"都是自我革命的具体表现，但不构成与"全面从严治党"并列的固定表述。</div><hr class="back-divider"><div class="preview-note">💡 "革命"比"净化/提高/革新"层级更高、更根本，是"永远在路上"的那个。</div>'
  },
  {
    label: "例题卡",
    cat: "practice",
    front: "【单选题】（____）是立足社会主义初级阶段基本国情，总结我国发展实践，借鉴国外发展经验，适应新的发展要求提出来的。\nA. 三个代表重要思想\nB. 以经济建设为中心\nC. 科学发展观\nD. 全面建设小康社会",
    back: '<div class="back-mirror">【单选题】（<strong>科学发展观</strong>）是立足社会主义初级阶段基本国情，总结我国发展实践，借鉴国外发展经验，适应新的发展要求提出来的。<br>A. 三个代表重要思想<br>B. 以经济建设为中心<br>C. 科学发展观<br>D. 全面建设小康社会</div><hr class="back-divider"><div class="preview-note">讲解：这段描述出自十七大报告对科学发展观的定义。"立足基本国情+总结发展实践+借鉴国外经验+适应新要求"构成了科学发展观的四个来源维度。A 项"三个代表"侧重党建层面；B 项"以经济建设为中心"是基本路线的组成部分；D 项"全面建设小康社会"是阶段性目标。</div><hr class="back-divider"><div class="preview-note">💡 关键词"发展"出现三次→对应的就是<strong>科学发展观</strong>。</div>'
  },
  {
    label: "例题卡",
    cat: "practice",
    front: '【单选题】二十届四中全会的核心议题围绕"坚持和完善中国特色社会主义制度、推进（____）"展开。\nA. 经济高质量发展\nB. 共同富裕\nC. 国家治理体系和治理能力现代化\nD. 全面从严治党',
    back: '<div class="back-mirror">【单选题】二十届四中全会的核心议题围绕"坚持和完善中国特色社会主义制度、推进（<strong>国家治理体系和治理能力现代化</strong>）"展开。<br>A. 经济高质量发展<br>B. 共同富裕<br>C. 国家治理体系和治理能力现代化<br>D. 全面从严治党</div><hr class="back-divider"><div class="preview-note">讲解：这是十九届四中全会和二十届四中全会一以贯之的核心议题。"制度"与"治理"是配套概念——坚持和完善制度是手段，推进治理现代化是目标。A 项"经济高质量发展"是经济领域的子目标；B 项"共同富裕"是社会主义的本质要求；D 项"全面从严治党"是党的建设主题。均非此议题的核心表述。</div><hr class="back-divider"><div class="preview-note">💡 "制度→治理"，记住这个链条：制度是治理的依据，治理是制度的实践。</div>'
  },
  {
    label: "例题卡",
    cat: "practice",
    front: "【单选题】党的二十大报告指出，我们要推进（____），坚持山水林田湖草沙一体化保护和系统治理。\nA. 美丽中国建设\nB. 生态环境整治\nC. 乡村振兴\nD. 环境保护",
    back: '<div class="back-mirror">【单选题】党的二十大报告指出，我们要推进（<strong>美丽中国建设</strong>），坚持山水林田湖草沙一体化保护和系统治理。<br>A. 美丽中国建设<br>B. 生态环境整治<br>C. 乡村振兴<br>D. 环境保护</div><hr class="back-divider"><div class="preview-note">讲解：二十大报告原文使用"美丽中国建设"作为生态文明建设的总体目标表述。"山水林田湖草沙一体化保护和系统治理"是其核心路径。B、D 项表述较窄，属于美丽中国建设的一部分而非总体概念；C 项"乡村振兴"是另一个独立战略。</div><hr class="back-divider"><div class="preview-note">💡 "美丽中国"是十八大以来生态文明建设的总目标，记住"美"字即可定位。</div>'
  },
  {
    label: "例题卡",
    cat: "practice",
    front: '【单选题】马克思主义之所以"行"，根本原因在于（____）\nA. 马克思主义具有鲜明的政治立场\nB. 马克思主义具有自觉的历史担当\nC. 马克思主义是科学的世界观和方法论\nD. 马克思主义是无产阶级政党自我革命的武器',
    back: '<div class="back-mirror">【单选题】马克思主义之所以"行"，根本原因在于（<strong>马克思主义是科学的世界观和方法论</strong>）<br>A. 马克思主义具有鲜明的政治立场<br>B. 马克思主义具有自觉的历史担当<br>C. 马克思主义是科学的世界观和方法论<br>D. 马克思主义是无产阶级政党自我革命的武器</div><hr class="back-divider"><div class="preview-note">讲解：习近平总书记在庆祝中国共产党成立 100 周年大会上指出"中国共产党为什么能，中国特色社会主义为什么好，归根到底是因为马克思主义行"。马克思主义"行"的根本原因在于其科学性——辩证唯物主义和历史唯物主义揭示了自然界和人类社会发展的客观规律。A/B/D 都是马克思主义的重要特征，但都不是"根本原因"。</div><hr class="back-divider"><div class="preview-note">💡 "行"的根本在于"科学性"，其他特征都建立在科学性的基础上。</div>'

    back: '<div class="back-mirror">【单选题】二十届四中全会强调，完善科技创新体制机制的核心是强化（<strong>企业（题库原文未标注选项，此为根据政策常识推断）</strong>）的主体地位。<br>A. 高校<br>B. 科研院所<br>C. 企业<br>D. 政府</div><hr class="back-divider"><div class="preview-note">讲解：二十届四中全会强调"强化企业科技创新主体地位"。这是近年来科技体制改革的核心方向——企业最贴近市场需求，能够最快将科技成果转化为生产力。高校和科研院所是基础研究的主力军，但"主体地位"落在企业；政府扮演引导和支持角色。</div><hr class="back-divider"><div class="preview-note">💡 科技创新的"最后一公里"是产业化，企业是产业化的载体，所以企业是主体。</div>'
  },
  {
    label: "例题卡",

var current = 0;

function render() {
  var card = cards[current];
  document.getElementById("front").innerHTML =
    '<div class="card-number">Card ' + (current + 1) + '</div>' +
    '<div class="card-label label-' + card.cat + '">' + card.label + '</div>' +
    '<div class="front-text">' + card.front + '</div>';
  document.getElementById("back").innerHTML =
    '<div class="card-number">Card ' + (current + 1) + '</div>' +
    '<div class="card-label label-' + card.cat + '">' + card.label + '</div>' +
    card.back;

  document.getElementById("progressText").textContent = "Card " + (current + 1) + " / " + cards.length;
  document.getElementById("progressFill").style.width = ((current + 1) / cards.length * 100) + "%";

  document.getElementById("prevBtn").disabled = (current === 0);
  document.getElementById("nextBtn").disabled = false;

  var cardEl = document.getElementById("card");
  cardEl.className = cardEl.className.replace(" flipped", "");

  var dots = document.getElementById("dots").children;
  for (var i = 0; i < dots.length; i++) {
    dots[i].className = dots[i].className.replace(" active", "");
    if (i === current) dots[i].className += " active";
  }
}

function flipCard() {
  var cardEl = document.getElementById("card");
  if (cardEl.className.indexOf("flipped") === -1) {
    cardEl.className += " flipped";
  } else {
    cardEl.className = cardEl.className.replace(" flipped", "");
  }
}

function nextCard() {
  if (current < cards.length - 1) {
    current++;
    render();
  } else {
    setTimeout(function() {
      document.getElementById("card").style.display = "none";
      document.getElementById("dots").style.display = "none";
      document.getElementById("prevBtn").style.display = "none";
      document.getElementById("nextBtn").style.display = "none";
      document.getElementById("completeScreen").style.display = "block";
      document.getElementById("progressText").style.display = "none";
      document.getElementById("progressFill").parentElement.style.display = "none";
      document.getElementsByClassName("key-hint")[0].style.display = "none";
    }, 400);
  }
}

function prevCard() {
  if (current > 0) {
    current--;
    render();
  }
}

function restart() {
  current = 0;
  document.getElementById("card").style.display = "";
  document.getElementById("dots").style.display = "";
  document.getElementById("prevBtn").style.display = "";
  document.getElementById("nextBtn").style.display = "";
  document.getElementById("completeScreen").style.display = "none";
  document.getElementById("progressText").style.display = "";
  document.getElementById("progressFill").parentElement.style.display = "";
  document.getElementsByClassName("key-hint")[0].style.display = "";
  render();
}

document.addEventListener("keydown", function(e) {
  if (e.key === "ArrowRight") nextCard();
  if (e.key === "ArrowLeft") prevCard();
  if (e.key === " " || e.key === "Enter") flipCard();
});

function initDots() {
  var container = document.getElementById("dots");
  for (var i = 0; i < cards.length; i++) {
    var dot = document.createElement("div");
    dot.className = "dot " + cards[i].cat;
    dot.onclick = (function(idx) {
      return function() {
        current = idx;
        render();
      };
    })(i);
    container.appendChild(dot);
  }
}

initDots();
render();
</script>
